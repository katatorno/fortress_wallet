pl = "Zapomnij plik"
pt = "Esquecer o ficheiro"

[privacy_file_open_first]
en = "To remember a file, open it first with the File button at the top."
pl = "Żeby zapamiętać plik, najpierw otwórz go przyciskiem „Plik” u góry."
pt = "Para memorizar um ficheiro, abra-o primeiro com o botão Ficheiro no topo."

[privacy_file_step_1]
en = "Open your file with the File button at the top."
pl = "Otwórz swój plik przyciskiem „Plik” u góry."
pt = "Abra o seu ficheiro com o botão Ficheiro no topo."

[privacy_file_step_2]
en = "Come back here and click the Remember button."
pl = "Wróć tutaj i kliknij przycisk „Zapamiętaj”."
pt = "Volte aqui e clique no botão Memorizar."

[privacy_file_step_3]
en = "On your next visit click Open at the top of the page. The browser asks whether to allow it, once or on every visit."
pl = "Przy następnej wizycie kliknij „Otwórz …” u góry strony. Przeglądarka zapyta o zgodę: jednorazową albo przy każdej wizycie."
pt = "Na visita seguinte clique em Abrir no topo da página. O navegador pergunta se permite, uma vez ou em todas as visitas."

[privacy_file_step_4]
en = "From then on the file opens by itself, with what is in it at that moment. It is safer to allow it each time: one click more, and the page cannot read the file without you."
pl = "Od tej pory plik otwiera się sam, zawsze z aktualną zawartością. Bezpieczniej jest zezwalać za każdym razem: to jedno kliknięcie więcej, a strona nie przeczyta pliku bez Ciebie."
pt = "A partir daí o ficheiro abre sozinho, com o conteúdo atual. É mais seguro permitir de cada vez: um clique a mais, e a página não lê o ficheiro sem si."

[privacy_file_revoke]
en = "Forget the file removes the link. The permission kept by the browser is withdrawn with the icon next to the address bar."
pl = "„Zapomnij plik” usuwa skrót. Zgodę zapamiętaną przez przeglądarkę cofniesz ikoną przy pasku adresu."
pt = "Esquecer o ficheiro remove a ligação. A permissão guardada pelo navegador retira-se no ícone junto à barra de endereço."

