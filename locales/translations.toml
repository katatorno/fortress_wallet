en = "Each connection shows the other side your IP address and browser. The app sends amounts and transactions nowhere."
pl = "Przy każdym połączeniu druga strona widzi Twój adres IP i przeglądarkę. Aplikacja nie wysyła nigdzie kwot ani transakcji."
pt = "Em cada ligação, o outro lado vê o seu endereço IP e o navegador. A aplicação não envia valores nem transações para lado nenhum."

[privacy_beware_server]
en = "The program comes from the server. Whoever controls the server can change the program, and a changed program can read an open file and send it away."
pl = "Program pochodzi z serwera. Kto ma kontrolę nad serwerem, może zmienić program, a zmieniony program może odczytać otwarty plik i go wysłać."
pt = "O programa vem do servidor. Quem controlar o servidor pode alterar o programa, e um programa alterado pode ler um ficheiro aberto e enviá-lo."

[privacy_beware_permission]
en = "If you allow access on every visit, the page reads and changes the file without asking. Opening the page is then enough."
pl = "Jeśli zezwolisz na dostęp przy każdej wizycie, strona czyta i zmienia plik bez pytania. Wystarczy wtedy samo wejście na stronę."
pt = "Se permitir o acesso em todas as visitas, a página lê e altera o ficheiro sem perguntar. Basta então abrir a página."

[privacy_net_when_open]
en = "On opening the page"
pl = "Przy wejściu na stronę"
pt = "Ao abrir a página"

[privacy_net_server]
en = "Sends the program, its texts and the example wallet. Your file does not go there."
pl = "Wysyła program, teksty i przykładowy portfel. Twój plik tam nie trafia."
pt = "Envia o programa, os textos e a carteira de exemplo. O seu ficheiro não vai para lá."

[privacy_net_now]
en = "Since you opened it, this page has fetched from: {hosts}"
pl = "Od otwarcia strona pobierała coś z: {hosts}"
pt = "Desde que a abriu, a página descarregou de: {hosts}"
