# ------------------------------------------------------------ data & privacy

[tab_privacy]
en = "Data & privacy"
pl = "Dane i prywatność"
pt = "Dados e privacidade"

[privacy_how_title]
en = "How it works, in short"
pl = "Jak to działa, w skrócie"
pt = "Como funciona, em resumo"

[privacy_how_1]
en = "You open the page. The server sends the program only, without any data of yours."
pl = "Wchodzisz na stronę. Serwer wysyła sam program, bez Twoich danych."
pt = "Abre a página. O servidor envia apenas o programa, sem dados seus."

[privacy_how_2]
en = "You choose a file ending in .json from your own computer. The program reads it in your browser."
pl = "Wybierasz plik z końcówką .json ze swojego komputera. Program czyta go w Twojej przeglądarce."
pt = "Escolhe um ficheiro .json do seu computador. O programa lê-o no seu navegador."

[privacy_how_3]
en = "The file is not sent to the server. Changes go back to your disk (Chrome and Edge on a computer), or you download a new copy."
pl = "Plik nie jest wysyłany na serwer. Zmiany wracają na Twój dysk (Chrome i Edge na komputerze) albo pobierasz nową kopię."
pt = "O ficheiro não é enviado para o servidor. As alterações voltam ao seu disco (Chrome e Edge no computador), ou descarrega uma cópia nova."

[privacy_how_4]
en = "Everything is in that file: your money, settings, theme, language and, if you use one, an API key."
pl = "W pliku jest wszystko: pieniądze, ustawienia, motyw, język i klucz API, jeśli go używasz."
pt = "Está tudo nesse ficheiro: o dinheiro, as definições, o tema, o idioma e a chave de API, se a usar."

[privacy_how_5]
en = "The browser may remember one thing only, a link to the file, and only if you switch it on below."
pl = "Przeglądarka może zapamiętać tylko jedno: skrót do pliku, i tylko jeśli to włączysz poniżej."
pt = "O navegador só pode memorizar uma coisa, uma ligação ao ficheiro, e apenas se a ativar abaixo."

[privacy_file_title]
en = "Remember my wallet file"
pl = "Pamiętanie pliku portfela"
pt = "Memorizar o ficheiro da carteira"

[privacy_file_path]
en = "The page does not know where the file is: the browser never tells it the path. It can only get a link to this one file (like the key to one drawer), and that link can be remembered (IndexedDB). The file's content is not stored."
pl = "Strona nie zna ścieżki do pliku, bo przeglądarka jej nie zdradza. Może dostać tylko skrót do tego jednego pliku (jak klucz do jednej szuflady) i ten skrót da się zapamiętać (IndexedDB). Zawartość pliku nie jest zapisywana."
pt = "A página não sabe onde está o ficheiro: o navegador nunca lhe diz o caminho. Só pode receber uma ligação a esse ficheiro (como a chave de uma gaveta), e essa ligação pode ser memorizada (IndexedDB). O conteúdo do ficheiro não é guardado."

[privacy_file_none]
en = "No file is remembered."
pl = "Żaden plik nie jest zapamiętany."
pt = "Nenhum ficheiro memorizado."

[privacy_file_granted]
en = "Remembered file: {name}. The browser allows reading it, so it opens by itself."
pl = "Zapamiętany plik: {name}. Przeglądarka pozwala go czytać, więc otwiera się sam."
pt = "Ficheiro memorizado: {name}. O navegador permite lê-lo, por isso abre sozinho."

[privacy_file_asks]
en = "Remembered file: {name}. The browser will ask for access when you open it."
pl = "Zapamiętany plik: {name}. Przy otwieraniu przeglądarka zapyta o dostęp."
pt = "Ficheiro memorizado: {name}. O navegador pedirá acesso quando o abrir."

[privacy_file_keep]
