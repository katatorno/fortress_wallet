pl = "Zapamiętaj otwarty plik"
pt = "Memorizar o ficheiro aberto"

[privacy_file_keep_named]
en = "Remember {name}"
pl = "Zapamiętaj plik {name}"
pt = "Memorizar {name}"

[privacy_file_forget]
